name: Bug report
description: Something builds, runs or simulates wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `./aletheia --version`, or the commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: OS, compiler and version (`cc --version`)
      placeholder: Arch Linux, gcc 15.2
    validations:
      required: true
  - type: dropdown
    id: core
    attributes:
      label: Core
      options:
        - single
        - multi
        - pipe
        - all three
        - not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command line, and the assembly file if it is not one of the demos
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Full output. If the cores disagree, add the output of `--ref`
      render: text
    validations:
      required: true
